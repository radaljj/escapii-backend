name: Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: escapii_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: cipassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/escapii_test
          DB_USERNAME: ci
          DB_PASSWORD: cipassword
          DDL_AUTO: update

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Upload JAR and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.27.194.35
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p /opt/escapii/backend/

      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 37.27.194.35
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: target/backend-0.0.1-SNAPSHOT.jar
          target: /opt/escapii/backend/
          strip_components: 1

      - name: Rename JAR and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.27.194.35
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mv /opt/escapii/backend/backend-0.0.1-SNAPSHOT.jar /opt/escapii/backend/app.jar
            systemctl restart escapii-backend
